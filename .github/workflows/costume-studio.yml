name: Build Costume Studio

# 図解（お絵かき）は PixelNest256/costume-studio（AGPL-3.0）をそのまま使います。
# 本家のソースに tools/costume-studio/embed-bridge.patch（iframe連携の小さな追加）だけを当ててビルドし、
# docs/costume-studio/ に置きます。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/costume-studio/**'
      - '.github/workflows/costume-studio.yml'

# 他のデータ更新と同時にpushしないよう、順番に実行する
concurrency:
  group: data-push
  cancel-in-progress: false

env:
  UPSTREAM_REPO: PixelNest256/costume-studio
  UPSTREAM_SHA: 430f7e18768ab207bb729037bbf20cb372a074ac

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream source
        run: |
          mkdir -p "$RUNNER_TEMP/cs" && cd "$RUNNER_TEMP/cs"
          git init -q
          git remote add origin "https://github.com/$UPSTREAM_REPO.git"
          git fetch --depth 1 origin "$UPSTREAM_SHA"
          git checkout -q FETCH_HEAD
      - name: Apply embed bridge patch
        run: |
          cd "$RUNNER_TEMP/cs"
          git apply --check "$GITHUB_WORKSPACE/tools/costume-studio/embed-bridge.patch"
          git apply "$GITHUB_WORKSPACE/tools/costume-studio/embed-bridge.patch"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          cd "$RUNNER_TEMP/cs"
          npm ci
          npm run build
      - name: Install into docs/costume-studio
        run: |
          rm -rf docs/costume-studio
          mkdir -p docs
          cp -r "$RUNNER_TEMP/cs/dist" docs/costume-studio
          cat > docs/costume-studio/SOURCE.txt <<TXT
          Costume Studio (AGPL-3.0-only) - https://github.com/$UPSTREAM_REPO
          Upstream commit: $UPSTREAM_SHA
          Local change (iframe bridge only): https://github.com/${GITHUB_REPOSITORY}/blob/main/tools/costume-studio/embed-bridge.patch
          Build recipe: https://github.com/${GITHUB_REPOSITORY}/blob/main/.github/workflows/costume-studio.yml
          TXT
          sed -i 's/^          //' docs/costume-studio/SOURCE.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/costume-studio
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Build Costume Studio (upstream ${UPSTREAM_SHA:0:7})"
          git pull --rebase origin main
          git push origin HEAD:main
