name = "twc-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
# コメント認証に使うScratchプロジェクトのID
AUTH_PROJECT_ID = "1410118669"
# このAPIを呼んでよいサイトのオリジン（カンマ区切り）。GitHub Pagesのオリジンに合わせる
ALLOWED_ORIGINS = "https://0823ils.github.io,http://localhost:5001"

# 参加申請を審査できるScratchユーザー名（カンマ区切り）
ADMIN_USERS = "TWC-ils"

B2_ENDPOINT = "s3.us-west-004.backblazeb2.com"
B2_BUCKET = "twc-chat-media-0823ils"
VIDEO_BASE_URL = ""
VIDEO_TTL_DAYS = "14"
# 閲覧URLのキャッシュ指定（秒）。ブラウザに動画・写真を覚えさせて、B2の転送量を減らす。"0" で無効
VIEW_CACHE_SECONDS = "604800"

[[d1_databases]]
binding = "DB"
database_name = "twc-ratings"
database_id = "f483147b-acc4-466c-ad21-00bfff8dcf93"
